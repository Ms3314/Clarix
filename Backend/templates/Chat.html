<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Clarix</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg-void: #000000;
            --bg-panel: #0d0d0d;
            --bg-card: #111111;
            --bg-input: #1a1a1a;
            --bg-hover: #222222;
            --blue-core: #ffffff;
            --blue-bright: #cccccc;
            --blue-glow: rgba(255, 255, 255, 0.12);
            --blue-subtle: rgba(255, 255, 255, 0.05);
            --text-primary: #f0f0f0;
            --text-secondary: #888888;
            --text-muted: #444444;
            --border: rgba(255,255,255,0.08);
            --border-blue: rgba(255, 255, 255, 0.18);
            --bubble-self: #ffffff;
            --bubble-other: #1c1c1c;
            --radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-void);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 10% 20%, rgba(255,255,255,0.02) 0%, transparent 70%),
                radial-gradient(ellipse 40% 60% at 90% 80%, rgba(255,255,255,0.01) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ─── JOIN SCREEN ─── */
        #joinScreen {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            animation: fadeIn 0.6s ease;
        }

        .join-card {
            background: var(--bg-card);
            border: 1px solid var(--border-blue);
            border-radius: 20px;
            padding: 40px 44px;
            width: 380px;
            box-shadow: 0 0 60px rgba(29,109,255,0.08), 0 24px 48px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .join-card h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .field-group input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field-group input:focus {
            border-color: var(--blue-core);
            box-shadow: 0 0 0 3px var(--blue-glow);
        }

        .field-group input::placeholder { color: var(--text-muted); }

        .join-btn {
            margin-top: 8px;
            background: var(--blue-core);
            color: #000000;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px var(--blue-glow);
        }

        .join-btn:hover {
            background: var(--blue-bright);
            transform: translateY(-1px);
            box-shadow: 0 8px 30px var(--blue-glow);
        }

        .join-btn:active { transform: translateY(0); }

        /* ─── APP LAYOUT ─── */
        #appScreen {
            display: none;
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        #appScreen.active { display: flex; animation: fadeIn 0.4s ease; }

        /* ─── SIDEBAR ─── */
        #sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 24px 20px 18px;
            border-bottom: 1px solid var(--border);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--blue-subtle);
            border: 1px solid var(--border-blue);
            border-radius: 50px;
            padding: 6px 12px 6px 6px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: #000000;
            flex-shrink: 0;
        }

        .user-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-section-label {
            padding: 18px 20px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        #roomList {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px;
        }

        #roomList::-webkit-scrollbar { width: 4px; }
        #roomList::-webkit-scrollbar-track { background: transparent; }
        #roomList::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }

        .room-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 2px;
            position: relative;
        }

        .room-item:hover { background: var(--bg-hover); }

        .room-item.active {
            background: var(--blue-subtle);
            border: 1px solid var(--border-blue);
        }

        .room-item.active .room-icon { color: var(--blue-bright); }
        .room-item.active .room-name { color: var(--text-primary); }

        .room-icon {
            font-size: 1.1rem;
            color: var(--text-muted);
            width: 20px;
            text-align: center;
        }

        .room-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            margin-left: auto;
            background: var(--blue-core);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        .sidebar-join {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        .sidebar-join-row {
            display: flex;
            gap: 8px;
        }

        .sidebar-join-row input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 12px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .sidebar-join-row input:focus { border-color: var(--blue-core); }
        .sidebar-join-row input::placeholder { color: var(--text-muted); }

        .sidebar-join-btn {
            background: var(--blue-core);
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .sidebar-join-btn:hover { background: var(--blue-bright); }

        /* ─── CHAT PANEL ─── */
        #chatPanel {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ─── EMPTY STATE ─── */
        #emptyState {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-muted);
        }

        .empty-icon { font-size: 3rem; opacity: 0.4; }

        .empty-text {
            font-size: 1rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* ─── CHAT HEADER ─── */
        #chatHeader {
            display: none;
            align-items: center;
            gap: 14px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .chat-header-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--blue-subtle);
            border: 1px solid var(--border-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--blue-bright);
        }

        .chat-header-info { flex: 1; }

        .chat-header-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chat-header-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .live-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ffffff;
            margin-right: 5px;
            box-shadow: 0 0 6px rgba(255,255,255,0.4);
            animation: pulse 2s infinite;
        }

        /* ─── MESSAGES ─── */
        #messagesWrap {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
            gap: 4px;
            flex-direction: column;
        }

        #messagesWrap::-webkit-scrollbar { width: 4px; }
        #messagesWrap::-webkit-scrollbar-track { background: transparent; }
        #messagesWrap::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }

        .msg-row {
            display: flex;
            margin-bottom: 6px;
            animation: msgIn 0.25s ease;
        }

        .msg-row.self { justify-content: flex-end; }
        .msg-row.other { justify-content: flex-start; }

        .msg-block { display: flex; flex-direction: column; max-width: 65%; }
        .msg-row.self .msg-block { align-items: flex-end; }
        .msg-row.other .msg-block { align-items: flex-start; }

        .msg-sender {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 3px;
            padding: 0 4px;
        }

        .msg-bubble {
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
        }

        .msg-row.self .msg-bubble {
            background: var(--bubble-self);
            color: #000000;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 16px rgba(255,255,255,0.08);
        }

        .msg-row.other .msg-bubble {
            background: var(--bubble-other);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .msg-time {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 4px;
            padding: 0 4px;
        }

        .system-msg {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .system-msg::before, .system-msg::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ─── INPUT BAR ─── */
        #inputBar {
            display: none;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px 12px 8px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-row:focus-within {
            border-color: var(--blue-core);
            box-shadow: 0 0 0 3px var(--blue-glow);
        }

        #messageInput {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            resize: none;
        }

        #messageInput::placeholder { color: var(--text-muted); }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: var(--blue-core);
            color: #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
            flex-shrink: 0;
        }

        .send-btn:hover { background: var(--blue-bright); transform: scale(1.05); }
        .send-btn:active { transform: scale(0.97); }

        .send-btn svg { width: 16px; height: 16px; }

        /* ─── ANIMATIONS ─── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

<!-- ─── JOIN SCREEN ─── -->
<div id="joinScreen">
    <div class="join-card">
        <h2>Connect to a room</h2>
        <div class="field-group">
            <label>Your Name</label>
            <input id="usernameInput" type="text" placeholder="e.g. Alex" autocomplete="off"/>
        </div>
        <div class="field-group">
            <label>Room Name</label>
            <input id="roomInput" type="text" placeholder="e.g. general — press Enter to join" autocomplete="off" oninput="autoJoinIfReady()"/>
        </div>
        <button class="join-btn" onclick="joinInitial()">Join Room →</button>
    </div>
</div>

<!-- ─── APP SCREEN ─── -->
<div id="appScreen">

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="user-pill">
                <div class="user-avatar" id="sidebarAvatar">?</div>
                <div class="user-name" id="sidebarUsername">—</div>
            </div>
        </div>

        <div class="sidebar-section-label">Rooms</div>

        <div id="roomList"></div>

        <div class="sidebar-join">
            <div class="sidebar-join-row">
                <input id="newRoomInput" type="text" placeholder="Join another room…" autocomplete="off"/>
                <button class="sidebar-join-btn" onclick="joinNewRoom()">+ Join</button>
            </div>
        </div>
    </div>

    <!-- Chat Panel -->
    <div id="chatPanel">

        <div id="chatHeader">
            <div class="chat-header-icon">💬</div>
            <div class="chat-header-info">
                <div class="chat-header-name" id="chatRoomName">—</div>
                <div class="chat-header-sub"><span class="live-dot"></span>Connected</div>
            </div>
        </div>

        <div id="emptyState">
            <div class="empty-icon">💬</div>
            <div class="empty-text">Select a room to start chatting</div>
        </div>

        <div id="messagesWrap"></div>

        <div id="inputBar">
            <div class="input-row">
                <input type="text" id="messageInput" placeholder="Send a message…" autocomplete="off"/>
                <button class="send-btn" onclick="sendMessage()" title="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    let currentUser = '';
    let currentRoom = '';
    let rooms = {};       // roomName -> { ws, messages[] }
    let activeRoom = '';

    /* ─── HELPERS ─── */
    function initials(name) {
        return name.slice(0, 2).toUpperCase();
    }

    function formatTime(date) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    /* ─── AUTO JOIN WHEN BOTH FIELDS FILLED ─── */
    function autoJoinIfReady() {
        const u = document.getElementById('usernameInput').value.trim();
        const r = document.getElementById('roomInput').value.trim();
        if (u && r) joinInitial();
    }

    /* ─── JOIN INITIAL ─── */
    function joinInitial() {
        const u = document.getElementById('usernameInput').value.trim();
        const r = document.getElementById('roomInput').value.trim();
        if (!u || !r) return;

        currentUser = u;

        document.getElementById('joinScreen').style.display = 'none';
        document.getElementById('appScreen').classList.add('active');
        document.getElementById('sidebarUsername').textContent = u;
        document.getElementById('sidebarAvatar').textContent = initials(u);

        connectRoom(r);
    }

    /* ─── JOIN ANOTHER ROOM ─── */
    function joinNewRoom() {
        const r = document.getElementById('newRoomInput').value.trim();
        if (!r || rooms[r]) { document.getElementById('newRoomInput').value = ''; return; }
        document.getElementById('newRoomInput').value = '';
        connectRoom(r);
    }

    /* ─── CONNECT TO ROOM ─── */
    function connectRoom(roomName) {
        if (rooms[roomName]) { switchRoom(roomName); return; }

        rooms[roomName] = { ws: null, messages: [] };

        const ws = new WebSocket(`ws://localhost:8000/ws/${roomName}/${currentUser}`);
        rooms[roomName].ws = ws;

        ws.onopen = () => {
            addRoomToSidebar(roomName);
            switchRoom(roomName);
        };

        ws.onmessage = (event) => {
            const text = event.data;
            const isSelf = text.startsWith(currentUser + ':');
            const parts = text.split(': ');
            const sender = parts[0];
            const body = parts.slice(1).join(': ');

            const msgObj = { sender, body, time: new Date(), self: sender === currentUser };
            rooms[roomName].messages.push(msgObj);

            if (activeRoom === roomName) {
                appendMessage(msgObj);
            } else {
                // increment unread badge
                const badge = document.querySelector(`[data-room="${roomName}"] .unread-badge`);
                if (badge) {
                    badge.style.display = 'flex';
                    badge.textContent = parseInt(badge.textContent || '0') + 1;
                } else {
                    const item = document.querySelector(`[data-room="${roomName}"]`);
                    if (item) {
                        const b = document.createElement('div');
                        b.className = 'unread-badge';
                        b.textContent = '1';
                        item.appendChild(b);
                    }
                }
            }
        };

        ws.onclose = () => {
            addSystemMessage(roomName, 'Disconnected from ' + roomName);
        };
    }

    /* ─── ADD ROOM SIDEBAR ─── */
    function addRoomToSidebar(roomName) {
        const list = document.getElementById('roomList');
        if (document.querySelector(`[data-room="${roomName}"]`)) return;

        const item = document.createElement('div');
        item.className = 'room-item';
        item.dataset.room = roomName;
        item.onclick = () => switchRoom(roomName);
        item.innerHTML = `
            <div class="room-icon">#</div>
            <div class="room-name">${roomName}</div>
        `;
        list.appendChild(item);
    }

    /* ─── SWITCH ROOM ─── */
    function switchRoom(roomName) {
        activeRoom = roomName;

        // Sidebar highlight
        document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
        const item = document.querySelector(`[data-room="${roomName}"]`);
        if (item) {
            item.classList.add('active');
            const badge = item.querySelector('.unread-badge');
            if (badge) badge.remove();
        }

        // Header
        document.getElementById('chatHeader').style.display = 'flex';
        document.getElementById('chatRoomName').textContent = '# ' + roomName;
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('messagesWrap').style.display = 'flex';
        document.getElementById('inputBar').style.display = 'block';

        // Render messages
        const wrap = document.getElementById('messagesWrap');
        wrap.innerHTML = '';

        const history = rooms[roomName]?.messages || [];
        history.forEach(m => appendMessage(m));

        wrap.scrollTop = wrap.scrollHeight;
        document.getElementById('messageInput').focus();
    }

    /* ─── APPEND MESSAGE ─── */
    function appendMessage(msg) {
        if (!msg.body) return;
        const wrap = document.getElementById('messagesWrap');

        // System messages (join/leave/disconnect)
        if (msg.body.includes('joined') || msg.body.includes('left') || msg.body.includes('Disconnected')) {
            const sysDiv = document.createElement('div');
            sysDiv.className = 'system-msg';
            sysDiv.textContent = msg.body;
            wrap.appendChild(sysDiv);
            wrap.scrollTop = wrap.scrollHeight;
            return;
        }

        const row = document.createElement('div');
        row.className = 'msg-row ' + (msg.self ? 'self' : 'other');

        const block = document.createElement('div');
        block.className = 'msg-block';

        if (!msg.self) {
            const senderEl = document.createElement('div');
            senderEl.className = 'msg-sender';
            senderEl.textContent = msg.sender;
            block.appendChild(senderEl);
        }

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = msg.body;
        block.appendChild(bubble);

        const timeEl = document.createElement('div');
        timeEl.className = 'msg-time';
        timeEl.textContent = formatTime(msg.time);
        block.appendChild(timeEl);

        row.appendChild(block);
        wrap.appendChild(row);
        wrap.scrollTop = wrap.scrollHeight;
    }

    /* ─── SYSTEM MSG ─── */
    function addSystemMessage(roomName, text) {
        rooms[roomName]?.messages.push({ sender: 'system', body: text, time: new Date(), self: false });
        if (activeRoom === roomName) {
            const wrap = document.getElementById('messagesWrap');
            const sysDiv = document.createElement('div');
            sysDiv.className = 'system-msg';
            sysDiv.textContent = text;
            wrap.appendChild(sysDiv);
            wrap.scrollTop = wrap.scrollHeight;
        }
    }

    /* ─── SEND MESSAGE ─── */
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !activeRoom) return;

        const ws = rooms[activeRoom]?.ws;
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(text);
        }
        input.value = '';
    }

    /* ─── ENTER KEY ─── */
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && document.activeElement.id === 'messageInput') {
            sendMessage();
        }
        if (e.key === 'Enter' && document.activeElement.id === 'usernameInput') {
            document.getElementById('roomInput').focus();
        }
        if (e.key === 'Enter' && document.activeElement.id === 'roomInput') {
            joinInitial();
        }
        if (e.key === 'Enter' && document.activeElement.id === 'newRoomInput') {
            joinNewRoom();
        }
    });
</script>
</body>
</html>
